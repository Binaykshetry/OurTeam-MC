#  ==============================================================
#   OurTeam - Standard Team Profile Blueprint & Default Template
#   This serves as the metadata profile definition when constructing
#   or reading custom team data structures.
#  ==============================================================

team-profile-template:
  # Metadata parameters
  creation:
    timestamp: 0
    formatted-date: "YYYY-MM-DD"
    created-by-uuid: ""

  # Roster details
  roster:
    owner: ""
    admins: []
    members: []

  # Economic structures
  bank:
    balance: 0.0
    level: 1
    xp: 0

  # Location coordinates
  locations:
    home:
      world: ""
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
    warps: {}

  # Flags
  settings:
    friendly-fire: false
    custom-icon: ""
    color-theme: "&#00f2fe"
