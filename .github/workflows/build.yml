# =========================================================================
#  OurTeam Plugin - Automated GitHub Actions Build Script for Minecraft .jar
#  This workflow compiles the plugin using Apache Maven and Java JDK 17
# =========================================================================

name: Build Minecraft Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source repository contents
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 17 with Maven caching
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Run the Maven compiler packaging to generate shaded .jar
      - name: Build plugin with Maven
        run: |
          cd paper
          mvn -B clean package

      # Step 4: Archive and upload the compiled .jar file as build artifact
      - name: Upload compiled plugin (.jar)
        uses: actions/upload-artifact@v3
        with:
          name: OurTeam-Plugin
          path: paper/target/OurTeam-*.jar
